<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f0d0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CBB Tour">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>CBB Tour 2026</title>
<style>
:root{
  --bg:#0f0d0c; --surface:#1a1716; --surface-2:#242020; --line:#332d2b;
  --text:#f4efe9; --muted:#a69d96; --faint:#6f6762;
  --red:#e03a3f; --red-soft:rgba(224,58,63,.14); --amber:#f0b54a; --amber-soft:rgba(240,181,74,.12);
  --green:#5cc98a; --radius:16px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh;overscroll-behavior-y:none}
button,input{font:inherit;color:inherit}
a{color:inherit}
.hidden{display:none!important}

/* ---------- Lock screen ---------- */
#lock{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--safe-t) + 32px) 24px calc(var(--safe-b) + 32px);max-width:440px;margin:0 auto}
.brand{font-weight:900;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand .b1{display:block;font-size:44px;color:var(--red)}
.brand .b2{display:block;font-size:22px;margin-top:6px}
.brand-sub{color:var(--muted);margin:10px 0 36px}
#lock label{display:block;font-size:14px;color:var(--muted);margin-bottom:8px}
.field{width:100%;padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px;outline:none}
.field:focus{border-color:var(--red)}
.hint{color:var(--muted);font-size:13px;margin:8px 0 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:15px 18px;font-weight:700;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--red);color:#fff;width:100%;margin-top:14px;font-size:17px}
.btn-primary:disabled{opacity:.6}
.remember{display:flex;gap:10px;align-items:center;margin-top:16px;color:var(--muted);font-size:14px}
.remember input{width:20px;height:20px;accent-color:var(--red)}
#lockErr{color:#ff8a8d;min-height:22px;margin-top:12px;font-size:15px}

/* ---------- App shell ---------- */
header.top{position:sticky;top:0;z-index:10;background:rgba(15,13,12,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(var(--safe-t) + 10px) 0 0;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;padding:0 16px 10px;gap:12px}
.top-title{font-weight:900;text-transform:uppercase;letter-spacing:.03em;font-size:15px;line-height:1.1}
.top-title span{color:var(--red)}
.top-title small{display:block;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0;font-size:12px;margin-top:2px}
.top-actions{display:flex;gap:6px;flex:0 0 auto}
.chip-btn{white-space:nowrap;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;cursor:pointer}
.chip-btn.accent{background:var(--red);border-color:var(--red);color:#fff}
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px;scrollbar-width:none;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;scroll-snap-align:center;min-width:62px;text-align:center;padding:7px 8px;border-radius:12px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
.dchip .dw{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dchip .dn{font-size:19px;font-weight:800;line-height:1.15}
.dchip .dc{font-size:11px;color:var(--muted);white-space:nowrap;max-width:76px;overflow:hidden;text-overflow:ellipsis}
.dchip.past{opacity:.45}
.dchip.today{border-color:var(--red)}
.dchip.today .dw{color:var(--red);font-weight:700}
.dchip.sel{background:var(--text);color:var(--bg);border-color:var(--text);opacity:1}
.dchip.sel .dw,.dchip.sel .dc{color:#5a524d}

main{max-width:640px;margin:0 auto;padding:16px 16px calc(var(--safe-b) + 40px)}
.hero{padding:6px 2px 18px}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:14px;font-weight:600}
.badge{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:4px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.badge.today{background:var(--red);color:#fff}
.badge.soon{background:var(--amber-soft);color:var(--amber)}
.hero h1{font-size:38px;line-height:1.02;margin:10px 0 6px;font-weight:900;letter-spacing:-.01em;text-transform:uppercase;overflow-wrap:anywhere}
.hero .venue{font-size:19px;font-weight:700}
.hero .venue span{color:var(--muted);font-weight:500}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800;display:flex;align-items:center;gap:8px}
.card h2 .ico{width:16px;height:16px;flex:0 0 auto}
.big{font-size:20px;font-weight:800;line-height:1.2}
.sub{color:var(--muted);font-size:15px}

.nextup{background:linear-gradient(135deg,#3a1517,#1a1716 70%);border-color:#5a2427}
.nextup .label{font-size:13px;color:#ffb3b5;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.nextup .what{font-size:26px;font-weight:900;margin:4px 0 2px}
.nextup .when{font-size:17px;color:var(--text)}
.nextup .when b{color:#ffb3b5}
.banner{background:var(--amber-soft);border:1px solid rgba(240,181,74,.35);color:var(--text)}
.banner .big{color:var(--amber)}

.travel-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--surface-2);border-radius:12px;padding:10px}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.stat .v{font-size:18px;font-weight:800;margin-top:2px;white-space:nowrap}
.route{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;flex-wrap:wrap}
.route .arrow{color:var(--red)}

.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:11px 0;border-top:1px solid var(--line);align-items:baseline}
.timeline li:first-child{border-top:0;padding-top:2px}
.timeline .t{font-weight:800;font-variant-numeric:tabular-nums;font-size:17px}
.timeline .l{font-size:16px}
.timeline .l small{display:block;color:var(--muted);font-size:13px}
.timeline li.show .t,.timeline li.show .l{color:var(--red)}
.timeline li.show .l{font-weight:800}
.timeline li.travel .t{color:var(--amber)}
.timeline li.done{opacity:.42}
.timeline li.now{position:relative}
.timeline li.now::before{content:"";position:absolute;left:-16px;top:16px;width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px var(--red-soft)}

.notes{list-style:none;margin:0;padding:0}
.notes li{display:flex;gap:10px;padding:6px 0;font-size:15px}
.notes li::before{content:"!";flex:0 0 22px;height:22px;border-radius:50%;background:var(--amber-soft);color:var(--amber);font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:1px}

dl.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:12px 0 0;font-size:15px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.addr{display:block;margin-top:4px;color:var(--muted);text-decoration:none}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.act{flex:1 1 auto;min-width:96px;background:var(--surface-2);border:1px solid var(--line);color:var(--text);padding:11px 12px;border-radius:12px;font-weight:700;font-size:15px;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.act svg{width:17px;height:17px}
.act.primary{background:var(--red);border-color:var(--red);color:#fff}

.contact{padding:12px 0;border-top:1px solid var(--line)}
.contact:first-of-type{border-top:0;padding-top:0}
.contact .r{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.contact .n{font-weight:700;font-size:17px}
.contact .x{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.contact .actions{margin-top:8px}
.contact .act{flex:0 1 auto;padding:8px 14px;font-size:14px}

.tomorrow{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
.tomorrow .arrow{font-size:24px;color:var(--muted)}
.pager{display:flex;gap:10px;margin-top:6px}
.pager button{flex:1}
.empty{color:var(--muted);font-style:italic}
.wx-row{display:flex;align-items:center;gap:14px;padding:4px 0}
.wx-row + .wx-row{border-top:1px solid var(--line);padding-top:12px;margin-top:8px}
.wx-ico{font-size:34px;line-height:1;width:44px;text-align:center}
.wx-main{flex:1}
.wx-t{font-size:22px;font-weight:800}
.wx-t span{color:var(--muted);font-weight:600;font-size:17px}
.wx-d{color:var(--muted);font-size:14px}
.wx-place{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.wx-warn{color:var(--amber);font-weight:700}

/* Overview */
.ov-item{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.ov-item:first-child{border-top:0}
.ov-item .od{text-align:center}
.ov-item .od .dw{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700}
.ov-item .od .dn{font-size:22px;font-weight:900;line-height:1}
.ov-item .od .dm{font-size:11px;color:var(--muted);text-transform:uppercase}
.ov-item .oc{font-weight:800}
.ov-item .ov{color:var(--muted);font-size:14px}
.ov-item .os{font-weight:800;color:var(--red);font-variant-numeric:tabular-nums}
.ov-item.past{opacity:.45}
.ov-item.today .oc::after{content:"TODAY";margin-left:8px;font-size:10px;background:var(--red);color:#fff;padding:2px 6px;border-radius:4px;vertical-align:middle}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--surface);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:20px 20px calc(var(--safe-b) + 20px);width:100%;max-width:520px}
.sheet h3{margin:0 0 10px}
.sheet p{color:var(--muted);margin:6px 0}
.sheet .btn{width:100%;margin-top:10px;background:var(--surface-2);border:1px solid var(--line)}
.sheet .btn.danger{color:#ff8a8d}
.foot{color:var(--faint);font-size:12px;text-align:center;margin-top:24px}
@media (min-width:600px){.hero h1{font-size:48px}}
</style>
</head>
<body>

<section id="lock">
  <div class="brand"><span class="b1">Climax</span><span class="b2">Blues Band</span></div>
  <p class="brand-sub">Evolution Tour 2026 · Band &amp; crew only</p>
  <form id="lockForm" autocomplete="off">
    <div id="linkBox" class="hidden">
      <label for="linkIn">Tour link</label>
      <input id="linkIn" class="field" type="url" autocapitalize="off" spellcheck="false" placeholder="Paste the link you were sent">
      <p class="hint">Open the app from the link the tour manager sent you, or paste that link here.</p>
    </div>
    <label for="pass">Tour PIN</label>
    <input id="pass" class="field" type="password" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Enter PIN" required>
    <label class="remember"><input id="remember" type="checkbox" checked> Keep me signed in on this phone</label>
    <button class="btn btn-primary" id="unlockBtn" type="submit">Unlock itinerary</button>
    <div id="lockErr" role="alert"></div>
  </form>
</section>

<div id="app" class="hidden">
  <header class="top">
    <div class="top-row">
      <div class="top-title">CBB <span>Evolution</span> Tour<small id="topSub"></small></div>
      <div class="top-actions">
        <button class="chip-btn" id="btnAll">All dates</button>
        <button class="chip-btn accent" id="btnToday">Today</button>
        <button class="chip-btn" id="btnMenu" aria-label="Menu">⋯</button>
      </div>
    </div>
    <nav class="strip" id="strip"></nav>
  </header>
  <main id="view"></main>
</div>

<div class="sheet hidden" id="menu">
  <div class="panel">
    <h3>Tour app</h3>
    <p><b>Add to your home screen</b><br>iPhone: tap Share, then “Add to Home Screen”.<br>Android: tap ⋮ in Chrome, then “Add to Home screen”.</p>
    <p id="updatedAt"></p>
    <button class="btn" id="btnRefresh">Check for updates</button>
    <button class="btn danger" id="btnLock">Lock (asks for the PIN again)</button>
    <button class="btn" id="btnClose">Close</button>
  </div>
</div>

<script>
(() => {
"use strict";
const LS_KEY = "cbb.key.v1", LS_LINK = "cbb.link.v1";
function linkFrom(str){ const m = /[#&?]k=([A-Za-z0-9_-]{16,})/.exec(str || ""); return m ? m[1] : null; }
let LINK = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};

/* ---------------- crypto ---------------- */
async function deriveKey(pass){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass.normalize("NFC") + ":" + LINK), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64d(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
async function decryptWith(key){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(PAYLOAD.iv)}, key, b64d(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function tryStoredKey(){
  const raw = store.get(LS_KEY);
  if(!raw) return null;
  try{
    const o = JSON.parse(raw);
    if(o.salt !== PAYLOAD.salt) { store.del(LS_KEY); return null; }
    const key = await crypto.subtle.importKey("raw", b64d(o.k), "AES-GCM", false, ["decrypt"]);
    return await decryptWith(key);
  }catch{ store.del(LS_KEY); return null; }
}

let DATA = null, TZ = "Europe/Berlin", sel = 0;

  const p = new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());
  const g = t => p.find(x => x.type === t).value;
  return { date:`${g("year")}-${g("month")}-${g("day")}`, mins: (+g("hour"))*60 + (+g("minute")) };
}
const dObj = iso => new Date(iso + "T12:00:00Z");
const fmt = (iso, o) => new Intl.DateTimeFormat("en-GB", Object.assign({timeZone:"UTC"}, o)).format(dObj(iso));
const daysBetween = (a,b) => Math.round((dObj(b) - dObj(a)) / 864e5);
function firstTime(s){ const m = /(\d{1,2})[:.](\d{2})/.exec(s||""); return m ? (+m[1])*60 + (+m[2]) : null; }
function rowMins(r){ const m = firstTime(r.t); return m === null ? null : ((/curfew/i.test(r.l) && m < 360) ? m + 1440 : m); }
function durMins(s){ const m = /(\d+(?:[.,]\d+)?)\s*h/.exec(s||""); return m ? Math.round(parseFloat(m[1].replace(",", "."))*60) : null; }
const hhmm = m => { m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m/60)).padStart(2,"0") + ":" + String(m%60).padStart(2,"0"); };
function inText(m){ if(m <= 0) return "now"; const h = Math.floor(m/60), mm = m%60; return "in " + (h ? h + "h " : "") + (mm || !h ? mm + "m" : "").trim(); }

  if(!p) return null;

  return s.length > 5 ? "tel:" + s : null;
}

/* ---------------- rendering ---------------- */

  const t = nowParts().date, d = DATA.days;
  if(t < d[0].date) return 0;
  if(t > d[d.length-1].date) return d.length - 1;
  const i = d.findIndex(x => x.date === t);
  return i < 0 ? d.findIndex(x => x.date > t) : i;
}

  const day = DATA.days[i], prev = DATA.days[i-1], rows = [];
  if(prev && prev.next && prev.next.busCall){
    rows.push({t:prev.next.busCall, l:"Bus call", s:`${prev.city} → ${day.city} · ${prev.next.distance}`, cls:"travel"});

  if(i === 0 && now.date < first){
    const n = daysBetween(now.date, first);
    out.push(`<div class="card banner"><div class="big">Tour starts in ${n} day${n===1?"":"s"}</div><div class="sub">${(() => { const fs = DATA.days.find(isShow); return `Arrive ${esc(day.city)} ${fmt(first,{weekday:"long", day:"numeric", month:"long"})} · first show ${esc(fs.city)}, ${fmt(fs.date,{weekday:"short", day:"numeric", month:"short"})}`; })()}</div></div>`);
  }
  if(i === DATA.days.length-1 && now.date > last){
    out.push(`<div class="card banner"><div class="big">That's a wrap</div><div class="sub">The tour finished on ${fmt(last,{day:"numeric", month:"long"})}. Welcome home.</div></div>`);
  }

  const rows = buildTimeline(i);
  if(day.weather && day.weather.length) out.push(`<div class="card" id="wx"><h2>${I.sun}Weather</h2><div class="sub">Loading forecast…</div></div>`);

  if(isToday){
    const up = rows.map(r => ({...r, m: rowMins(r)})).filter(r => r.m !== null && !r.est).find(r => r.m >= now.mins);
    if(up) out.push(`<div class="card nextup"><div class="label">Next up</div><div class="what">${esc(up.l)}</div><div class="when"><b>${esc(up.t)}</b> · ${inText(up.m - now.mins)}${up.s ? `<div class="sub">${esc(up.s)}</div>` : ""}</div></div>`);
  }

  if(day.flight){
    const f = day.flight;
    const from = prev && prev.hotel ? placeStr(prev.hotel.name, prev.hotel, prev.country) : null;
    out.push(`<div class="card"><h2>${I.plane}Flight home</h2>
      <div class="route">${esc(f.fromCode || "")} <span class="arrow">→</span> ${esc(f.toCode || f.to)}</div>
      <div class="travel-grid">
        <div class="stat"><div class="k">Departs</div><div class="v">${esc(f.dep)}</div></div>
        <div class="stat" style="grid-column:span 2"><div class="k">From</div><div class="v" style="white-space:normal;font-size:15px">${esc(f.from)}</div></div>
      </div>
      <div class="sub">${prev && prev.hotel ? `Check out of ${esc(prev.hotel.name)} before you leave for the airport.` : ""}</div>
      <div class="actions">${act(mapsDir(from, f.fromQuery || f.from), I.nav, "Route to airport", "primary")}</div>
    </div>`);
  } else if(prev && prev.next && day.venue){
    const n = prev.next;
    const from = prev.hotel ? placeStr(prev.hotel.name, prev.hotel, prev.country) : placeStr(prev.venue.name, prev.venue, prev.country);
    const to = placeStr(day.venue.name, day.venue, day.country);
    const bc = firstTime(n.busCall), d = durMins(n.duration);
    out.push(`<div class="card"><h2>${I.bus}Travel day</h2>
      <div class="route">${esc(prev.city)} <span class="arrow">→</span> ${esc(day.city)}</div>
      <div class="travel-grid">
        <div class="stat"><div class="k">Bus call</div><div class="v">${esc(n.busCall)}</div></div>
        <div class="stat"><div class="k">Distance</div><div class="v">${esc(n.distance)}</div></div>
        <div class="stat"><div class="k">Drive</div><div class="v">~${esc(n.duration)}</div></div>
      </div>
      <div class="sub">${prev.hotel && prev.hotel.checkout ? `Check out of ${esc(prev.hotel.name)} by <b>${esc(prev.hotel.checkout)}</b>. ` : ""}${bc !== null && d ? `Arrival around ${hhmm(bc+d)} if there are no stops.` : ""}</div>
      <div class="actions">${act(mapsDir(from, to), I.nav, "Route to venue", "primary")}</div>
    </div>`);
  } else if(day.sameAsPrevious){
    out.push(`<div class="card"><h2>${I.bus}No travel today</h2><div class="sub">Same venue and hotel as yesterday.</div></div>`);
  } else if(day.stayNote){
    out.push(`<div class="card"><h2>${I.bus}No travel today</h2><div class="sub">${esc(day.stayNote)}</div></div>`);
  }

  out.push(`<div class="card"><h2>${I.clock}Schedule</h2><ul class="timeline">${rows.map((r, k) => {
    let cls = r.cls;
    if(isToday){
      const m = rowMins(r);
      const nextM = rows.slice(k+1).map(rowMins).find(x => x !== null);
      if(m !== null && !r.est && nextM != null && nextM <= now.mins) cls += " done";
      else if(m !== null && m <= now.mins && (nextM == null || nextM > now.mins)) cls += " now";
    }
    return `<li class="${cls}"><span class="t">${esc(r.t)}</span><span class="l">${esc(r.l)}${r.s ? `<small>${esc(r.s)}</small>` : ""}</span></li>`;
  }).join("")}</ul></div>`);

  if(day.notes && day.notes.length){
    out.push(`<div class="card"><h2>${I.warn}Heads up</h2><ul class="notes">${day.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul></div>`);
  }

  const h = day.hotel;
  if(h){
    const hq = placeStr(h.name, h, day.country);
    const kv = [["Check-in", h.checkin], ["Check-out", h.checkout], ["Rooms", h.rooming], ["Booked under", h.reservation], ["To venue", h.distance], ["Parking", h.parking], ["Phone", h.phone]].filter(x => x[1]);
    out.push(`<div class="card"><h2>${I.bed}Hotel</h2>
      <div class="big">${esc(h.name)}</div>
      <a class="addr" href="${esc(mapsQ(h.name, h.address, h.postcode, day.country))}" target="_blank" rel="noopener">${esc(h.address)}${h.address && h.postcode ? ", " : ""}${esc(h.postcode)}</a>
      <dl class="kv">${kv.map(([k,v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
      <div class="actions">
        ${act(mapsQ(h.name, h.address, h.postcode, day.country), I.nav, "Directions", "primary")}
        ${act(telHref(h.phone), I.phone, "Call")}
        ${act(h.website, I.web, "Website")}
        ${day.venue ? act(mapsDir(hq, placeStr(day.venue.name, day.venue, day.country)), I.pin.replace('class="ico" ',''), "Hotel → venue") : ""}
      </div></div>`);
  } else if(day.type !== "home"){
    out.push(`<div class="card"><h2>${I.bed}Hotel</h2><div class="empty">No hotel listed in the tourbook for this date – check with tour management.</div></div>`);
  }

  const v = day.venue;
  if(v){
  const vkv = [["Capacity", v.capacity], ["Phone", v.phone]].filter(x => x[1]);
  out.push(`<div class="card"><h2>${I.mic}Venue</h2>
    <div class="big">${esc(v.name)}</div>
    <a class="addr" href="${esc(mapsQ(v.name, v.address, v.postcode, day.country))}" target="_blank" rel="noopener">${esc(v.address)}, ${esc(v.postcode)}</a>
    ${vkv.length ? `<dl class="kv">${vkv.map(([k,x]) => `<dt>${k}</dt><dd>${esc(x)}</dd>`).join("")}</dl>` : ""}
    <div class="actions">${act(mapsQ(v.name, v.address, v.postcode, day.country), I.nav, "Directions", "primary")}${act(telHref(v.phone), I.phone, "Call venue")}</div>
  </div>`);
  }

  if(day.dinner) out.push(`<div class="card"><h2>${I.food}Dinner</h2><div>${esc(day.dinner)}</div></div>`);

  if(day.contacts && day.contacts.length){
    out.push(`<div class="card"><h2>${I.ppl}Contacts</h2>${day.contacts.map(c => `<div class="contact">
      <div class="r">${esc(c.role)}</div><div class="n">${esc(c.name || "—")}</div>
      <div class="x">${esc([c.phone, c.email].filter(Boolean).join(" · "))}</div>
      <div class="actions">${act(telHref(c.phone), I.phone, "Call")}${act(c.email ? "mailto:" + c.email : null, I.mail, "Email")}</div>
    </div>`).join("")}</div>`);
  }

  if(nxt){
    const travel = day.next ? `Bus call ${esc(day.next.busCall)} · ${esc(day.next.distance)} · ~${esc(day.next.duration)}` : nxt.flight ? `Flight ${esc(nxt.flight.dep)} from ${esc(nxt.flight.from)}` : nxt.sameAsPrevious ? "Same venue, no travel" : nxt.stayNote ? "Same hotel, no travel" : "";
    out.push(`<div class="card tomorrow" data-go="${i+1}"><div><div class="sub">Next · ${fmt(nxt.date,{weekday:"short", day:"numeric", month:"short"})}</div><div class="big">${esc(headline(nxt))}</div><div class="sub">${travel}</div></div><div class="arrow">›</div></div>`);
  }
  out.push(`<div class="pager">
    <button class="chip-btn" data-go="${i-1}" ${i === 0 ? "disabled style='opacity:.35'" : ""}>‹ Previous day</button>
    <button class="chip-btn" data-go="${i+1}" ${i === DATA.days.length-1 ? "disabled style='opacity:.35'" : ""}>Next day ›</button>
  </div>
  <p class="foot">From the ${esc(DATA.source || "tourbook")}. Times are local (CET).</p>`);

  $("#view").innerHTML = out.join("");
  renderStrip();
  if(day.weather && day.weather.length) loadWeather(day);
}

/* ---------------- weather (Open-Meteo, no key; only coordinates are sent) ---------------- */
const WX = {0:["☀️","Clear"],1:["🌤️","Mostly clear"],2:["⛅","Partly cloudy"],3:["☁️","Overcast"],45:["🌫️","Fog"],48:["🌫️","Freezing fog"],
  51:["🌦️","Light drizzle"],53:["🌦️","Drizzle"],55:["🌧️","Heavy drizzle"],56:["🌧️","Freezing drizzle"],57:["🌧️","Freezing drizzle"],
  61:["🌧️","Light rain"],63:["🌧️","Rain"],65:["🌧️","Heavy rain"],66:["🌧️","Freezing rain"],67:["🌧️","Freezing rain"],
  71:["🌨️","Light snow"],73:["🌨️","Snow"],75:["❄️","Heavy snow"],77:["🌨️","Snow grains"],80:["🌦️","Showers"],81:["🌧️","Showers"],82:["⛈️","Heavy showers"],
  85:["🌨️","Snow showers"],86:["❄️","Heavy snow showers"],95:["⛈️","Thunderstorm"],96:["⛈️","Thunderstorm, hail"],99:["⛈️","Thunderstorm, hail"]};
async function fetchWx(w, date){
  const ck = `cbb.wx.${date}.${w.lat},${w.lon}`;
  try{ const c = JSON.parse(store.get(ck) || "null"); if(c && Date.now() - c.at < 3 * 3600e3) return c; }catch{}
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${w.lat}&longitude=${w.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,snowfall_sum,wind_speed_10m_max&timezone=auto&start_date=${date}&end_date=${date}`;
  try{
    const r = await fetch(url); if(!r.ok) throw 0;
    const j = await r.json(), dd = j.daily;
    if(!dd || !dd.time || !dd.time.length || dd.temperature_2m_max[0] == null) throw 0;
    const o = {at:Date.now(), code:dd.weather_code[0], max:dd.temperature_2m_max[0], min:dd.temperature_2m_min[0], pop:dd.precipitation_probability_max[0], snow:dd.snowfall_sum[0], wind:dd.wind_speed_10m_max[0]};
    store.set(ck, JSON.stringify(o)); return o;
  }catch{
    try{ const c = JSON.parse(store.get(ck) || "null"); if(c) return Object.assign(c, {stale:true}); }catch{}
    return null;
  }
}
async function loadWeather(day){
  const box = document.getElementById("wx"); if(!box) return;
  const ahead = daysBetween(nowParts().date, day.date);
  if(ahead > 15){
    const from = new Date(dObj(day.date) - 15 * 864e5).toISOString().slice(0,10);
    box.querySelector(".sub").textContent = `Forecast appears from ${fmt(from,{weekday:"short", day:"numeric", month:"short"})} (about two weeks ahead).`;
    return;
  }
  if(ahead < -1){ box.remove(); return; }
  const res = await Promise.all(day.weather.map(w => fetchWx(w, day.date)));
  if(!document.body.contains(box) || sel !== DATA.days.indexOf(day)) return;
  if(res.every(x => !x)){ box.querySelector(".sub").textContent = "Forecast not available right now – check again with signal."; return; }
  box.innerHTML = `<h2>${I.sun}Weather · ${fmt(day.date,{weekday:"short", day:"numeric", month:"short"})}</h2>` + day.weather.map((w,k) => {
    const x = res[k]; if(!x) return "";
    const [ico, txt] = WX[x.code] || ["🌡️",""];
    const extra = [x.pop != null ? `Rain/snow ${x.pop}%` : "", x.snow > 0 ? `<span class="wx-warn">Snow ${x.snow} cm</span>` : "", x.wind >= 50 ? `<span class="wx-warn">Wind ${Math.round(x.wind)} km/h</span>` : ""].filter(Boolean).join(" · ");
    return `<div class="wx-row"><div class="wx-ico">${ico}</div><div class="wx-main">${day.weather.length > 1 ? `<div class="wx-place">${esc(w.label)}</div>` : ""}<div class="wx-t">${Math.round(x.max)}° <span>/ ${Math.round(x.min)}°</span></div><div class="wx-d">${esc(txt)}${extra ? " · " + extra : ""}${x.stale ? " · saved earlier" : ""}</div></div></div>`;
  }).join("");
}

function renderAll(){
  const t = nowParts().date;
  $("#view").innerHTML = `<section class="hero"><div class="meta"><span>${showCount()} shows · ${fmt(DATA.days[0].date,{day:"numeric", month:"short"})} – ${fmt(DATA.days.at(-1).date,{day:"numeric", month:"short", year:"numeric"})}</span></div><h1>All dates</h1></section>
  <div class="card">${DATA.days.map((d,i) => {
    const show = (d.schedule.find(([l]) => /show|flight/i.test(l)) || [,""])[1];
    const cls = ["ov-item", d.date < t ? "past" : "", d.date === t ? "today" : ""].join(" ");
    return `<div class="${cls}" data-go="${i}">
      <div class="od"><div class="dw">${fmt(d.date,{weekday:"short"})}</div><div class="dn">${fmt(d.date,{day:"numeric"})}</div><div class="dm">${fmt(d.date,{month:"short"})}</div></div>
      <div><div class="oc">${esc(d.type === "home" ? "Flight home" : d.city)}</div><div class="ov">${d.venue ? esc(d.venue.name) + " · " + esc(d.country) : d.flight ? "Flight " + esc(d.flight.from.replace(/ \(.*\)/,"")) + " → " + esc(d.flight.toCity || d.flight.to) : "Arrival · no show"}${d.next ? ` · then ${esc(d.next.distance)}` : ""}</div></div>
      <div class="os">${esc(firstTime(show) !== null ? hhmm(firstTime(show)) : "")}</div></div>`;
  }).join("")}</div>`;
  document.querySelectorAll(".dchip").forEach(c => c.classList.remove("sel"));
  window.scrollTo({top:0});
}

function go(i){ if(i < 0 || i >= DATA.days.length) return; renderDay(i); window.scrollTo({top:0}); }

function start(data){
  DATA = data; TZ = data.timezone || TZ;
  $("#lock").classList.add("hidden");
  $("#app").classList.remove("hidden");
  $("#topSub").textContent = `${fmt(data.days[0].date,{day:"numeric", month:"short"})} – ${fmt(data.days.at(-1).date,{day:"numeric", month:"short"})} · ${showCount()} shows`;
  if(PAYLOAD.built) $("#updatedAt").textContent = "Itinerary last updated " + new Date(PAYLOAD.built).toLocaleString("en-GB", {timeZone:TZ, dateStyle:"medium", timeStyle:"short"}) + ".";
  renderDay(todayIndex());

  document.addEventListener("click", e => {
    const g = e.target.closest("[data-go]"); if(g && !g.disabled){ go(+g.dataset.go); return; }
    const c = e.target.closest(".dchip"); if(c){ go(+c.dataset.i); }
  });
  $("#btnToday").onclick = () => go(todayIndex());
  $("#btnAll").onclick = renderAll;
  $("#btnMenu").onclick = () => $("#menu").classList.remove("hidden");
  $("#btnClose").onclick = () => $("#menu").classList.add("hidden");
  $("#menu").onclick = e => { if(e.target.id === "menu") $("#menu").classList.add("hidden"); };
  $("#btnLock").onclick = () => { store.del(LS_KEY); location.reload(); };
  $("#btnRefresh").onclick = async () => {
    try{ const r = await navigator.serviceWorker?.getRegistration(); await r?.update(); }catch{}
    location.reload();
  };

  // swipe between days
  let sx = null, sy = null;
  $("#view").addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
  $("#view").addEventListener("touchend", e => {
    if(sx === null || !document.querySelector(".hero h1") || $("#view").querySelector(".ov-item")) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8) go(sel + (dx < 0 ? 1 : -1));
    sx = null;
  }, {passive:true});

  // keep "next up" fresh
  setInterval(() => { if(!$("#view").querySelector(".ov-item")) { const y = window.scrollY; renderDay(sel); window.scrollTo({top:y}); } }, 60000);
}

async function init(){
  if(!PAYLOAD){ $("#lockErr").textContent = "No itinerary loaded."; return; }
  LINK = linkFrom(location.hash) || store.get(LS_LINK);
  const d = await tryStoredKey();
  if(d) return start(d);
  if(!LINK) $("#linkBox").classList.remove("hidden");
  $("#lockForm").addEventListener("submit", async e => {
    e.preventDefault();
    const pass = $("#pass").value.trim();
    if(!pass) return;
    if(!LINK){ LINK = linkFrom($("#linkIn").value); if(!LINK){ $("#lockErr").textContent = "Paste the full tour link first."; return; } }
    $("#unlockBtn").disabled = true; $("#unlockBtn").textContent = "Unlocking…"; $("#lockErr").textContent = "";
    try{
      const key = await deriveKey(pass);
      const data = await decryptWith(key);
      if($("#remember").checked) store.set(LS_KEY, JSON.stringify({salt:PAYLOAD.salt, k:b64e(await crypto.subtle.exportKey("raw", key))}));
      store.set(LS_LINK, LINK);
      start(data);
    }catch{
      $("#lockErr").textContent = "That PIN didn\'t work. Check it and try again.";
      $("#unlockBtn").disabled = false; $("#unlockBtn").textContent = "Unlock itinerary";
    }
  });
  $("#pass").focus();
}

if("serviceWorker" in navigator && location.protocol === "https:"){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
init();
})();
</script>
