<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#0f0d0c"><title>Tour finished</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f0d0c;color:#f4efe9;font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:24px;box-sizing:border-box}
main{max-width:420px}h1{margin:0;font-size:40px;color:#e03a3f;text-transform:uppercase;line-height:1}h2{margin:6px 0 24px;text-transform:uppercase;font-size:20px}p{color:#a69d96}</style></head>
<body><main><h1>Climax</h1><h2>Blues Band</h2><p style="color:#f4efe9;font-weight:800;font-size:20px">That's a wrap – thanks for a great tour.</p><p>The tour itinerary has been removed. You can delete this app from your home screen.</p></main>
<script>
try{localStorage.clear()}catch(e){}
if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{})}
if(window.caches){caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))).catch(()=>{})}
</script></body></html>
